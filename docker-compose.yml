# gameshelf — app + database
#
# Dev (WSL2):  docker compose up -d db     # DB only, app runs via npm run dev
# Prod (VM):   docker compose up -d        # both services

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gameshelf
    volumes:
      # Bind mount, not a named volume, so Proxmox backups pick it up.
      # Kept out of ./data: the app reads ./data/covers, and the bundler walks
      # that tree while tracing it. Postgres owns its files as root, so the walk
      # fails the build.
      - ../gameshelf-data/pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for dev. Remove this block on the server.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameshelf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gameshelf:${POSTGRES_PASSWORD}@db:5432/gameshelf
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?}
      SGDB_API_KEY: ${SGDB_API_KEY:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COVERS_DIR: /data/covers
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-jay}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    volumes:
      # Downloaded cover art — keep it out of the image and in backups.
      - ../gameshelf-data/covers:/data/covers
    ports:
      - "3000:3000"
