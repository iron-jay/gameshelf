# gameshelf — database, migrations, app
#
# Dev (WSL2):  docker compose up -d db                 # Postgres only; app runs via npm run dev
# Prod (VM):   docker compose pull && docker compose up -d
#
# The app and migrate images are built by GitHub Actions and pulled from
# ghcr.io. `next build` does not fit comfortably in the 2 GB the deployment
# target has, and there is no reason to spend the server's memory on it.
# To build them by hand instead, see the README.
#
# Both port bindings default to 127.0.0.1, so nothing is reachable from the LAN
# without asking. On the server the reverse proxy reaches the app over loopback;
# set APP_BIND if it lives on another host.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameshelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gameshelf
    volumes:
      # Bind mount, not a named volume, so Proxmox backups pick it up.
      # Kept out of ./data: the app reads ./data/covers, and the bundler walks
      # that tree while tracing it. Postgres owns its files as root, so the walk
      # fails the build.
      - ../gameshelf-data/pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameshelf"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs to completion, then the app starts. drizzle-kit and tsx are dev
  # dependencies and are not in the runtime image, so schema changes and the
  # first user need a stage that still has node_modules.
  migrate:
    image: ${GAMESHELF_IMAGE:-ghcr.io/iron-jay/gameshelf}-migrate:${GAMESHELF_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gameshelf:${POSTGRES_PASSWORD}@db:5432/gameshelf
      ADMIN_USERNAME: ${ADMIN_USERNAME:-jay}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}

  app:
    image: ${GAMESHELF_IMAGE:-ghcr.io/iron-jay/gameshelf}:${GAMESHELF_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://gameshelf:${POSTGRES_PASSWORD}@db:5432/gameshelf
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:?}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:?}
      SGDB_API_KEY: ${SGDB_API_KEY:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      # Set true only where the port is genuinely private: it removes the
      # password for everything, including editing and deleting.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      COVERS_DIR: /data/covers
      # The session cookie's Secure flag is derived from this, so it must be the
      # public https:// URL in production.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      # Downloaded cover art — keep it out of the image and in backups.
      # The container runs as uid 1001; the host directory must match.
      - ../gameshelf-data/covers:/data/covers
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
