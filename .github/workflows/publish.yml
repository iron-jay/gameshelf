name: Publish images

# Builds the two images the compose stack needs and pushes them to ghcr.io, so
# the server pulls instead of building. `next build` does not fit comfortably in
# the 2 GB the deployment target has.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app. Next's standalone output, no node_modules, runs as uid 1001.
      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Migrations and the first user. A separate image because drizzle-kit and
      # tsx are dev dependencies and are deliberately absent from the app image.
      - name: Build and push the migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-migrate:latest
            ghcr.io/${{ github.repository }}-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:latest"
            echo "ghcr.io/${{ github.repository }}-migrate:latest"
            echo '```'
            echo
            echo "Deploy with \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
